name: freqwave_mobile
description: Tactical Walkie-Talkie Radio, Synced Boombox & Community Hub for Android.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  flutter_webrtc: ^1.6.2+hotfix.3
  just_audio: ^0.10.6
  flutter_foreground_task: ^11.0.3
  provider: ^6.1.1
  mqtt_client: ^10.11.11
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
